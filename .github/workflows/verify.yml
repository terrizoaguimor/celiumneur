name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Audit-pack integrity
        run: python audit/verify_sources.py --validate-manifest

      - name: Install HDL tools and locked Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iverilog verilator
          python -m pip install --require-hashes --requirement requirements-lock.txt

      - name: Golden-model tests
        run: python -m pytest -q golden

      - name: RTL cocotb suite
        run: python verification/cocotb/run_tests.py

      - name: Self-checking raw probes
        run: python verification/cocotb/run_tests.py --probes

      - name: Verilator lint
        run: >-
          verilator --lint-only -Wall --top-module celiumneur_soc
          rtl/hyphae/hypha_link_fifo.v
          rtl/hyphae/hypha_router.v
          rtl/soma/soma_dendrite.v
          rtl/soma/soma_core.v
          rtl/soma/neuro_tile.v
          rtl/top/hypha_config_endpoint.v
          rtl/top/hyphae_mesh_2x2.v
          rtl/top/celiumneur_soc.v

  external-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Reproduce pinned external audit
        run: python audit/verify_sources.py --clone-dir "$RUNNER_TEMP/celiumneur-audit-sources"
